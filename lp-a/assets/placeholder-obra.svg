<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <pattern id="diag-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="20" stroke="#D8DDE3" stroke-width="0.75" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#F5F5F5"/>
  <rect width="100%" height="100%" fill="url(#diag-grid)" opacity="0.6"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#9CADC2" stroke-width="1" stroke-dasharray="6,4"/>
  
  <g transform="translate(300, 225)">
    <!-- Ícone de Galeria Industrial -->
    <circle cx="0" cy="-30" r="36" fill="#EBEEF5" stroke="#9CADC2" stroke-width="1.5"/>
    <path d="M -16 -20 L -6 -35 L 6 -18 L 14 -28 L 22 -16" fill="none" stroke="#4181BC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-10" cy="-42" r="3" fill="#37B4CE"/>
    
    <text x="0" y="30" fill="#1D1D1D" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">INSTALAÇÃO EM CLIENTE</text>
    <text x="0" y="52" fill="#737373" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Supermercado / Distribuidora / Indústria</text>
    <rect x="-65" y="70" width="130" height="24" rx="4" fill="#EBEEF5" stroke="#D8DDE3"/>
    <text x="0" y="86" fill="#4181BC" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">[CONFIRMAR FOTO]</text>
  </g>
