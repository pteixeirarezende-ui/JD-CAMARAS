<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D8DDE3" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="tech-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBEEF5"/>
      <stop offset="100%" stop-color="#E2E7F0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#tech-bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Diagrama isométrico de câmara fria modular -->
  <g transform="translate(400, 300) scale(1.1)">
    <!-- Base e painéis -->
    <polygon points="0,-120 180,-20 0,80 -180,-20" fill="#FFFFFF" stroke="#9CADC2" stroke-width="2"/>
    <polygon points="-180,-20 0,80 0,180 -180,80" fill="#F5F5F5" stroke="#9CADC2" stroke-width="2"/>
    <polygon points="0,80 180,-20 180,80 0,180" fill="#E0E4EE" stroke="#9CADC2" stroke-width="2"/>
    
    <!-- Linhas de cota / blueprint -->
    <line x1="-190" y1="90" x2="-10" y2="190" stroke="#4181BC" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="10" y1="190" x2="190" y2="90" stroke="#4181BC" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Rótulo técnico -->
    <rect x="-110" y="-30" width="220" height="40" rx="4" fill="#3B497F" />
    <text x="0" y="-6" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">FOTO DE OBRA REAL</text>
    <text x="0" y="14" fill="#EBEEF5" font-family="monospace" font-size="10" text-anchor="middle">[CONFIRMAR ACERVO JD]</text>
  </g>
</svg>
